<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/about">About</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}

    <!-- Carga de Medium Zoom desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Detecta si es pantalla móvil para ajustar márgenes
        const isMobile = window.innerWidth <= 768;

        mediumZoom('.post img, article img, .posts img', {
          margin: isMobile ? 0 : 24,          // En móvil la imagen ocupa el 100% del ancho
          background: 'rgba(0, 0, 0, 0.95)',  // Fondo oscuro para resaltar detalles
          scrollOffset: 40
        });
      });
    </script>
    
  </body>
</html>

<style>
  .image-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.92);
    z-index: 999999;
    touch-action: none; /* Bloquea el scroll de la página en móvil */
  }

  .image-modal-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .image-modal-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
    transform-origin: center center;
  }

  .image-modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #fff;
    font-size: 34px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000000;
    font-family: monospace;
    padding: 10px;
  }
</style>

<div id="imageModal" class="image-modal-overlay">
  <span class="image-modal-close" id="modalClose">&times;</span>
  <div class="image-modal-container" id="modalContainer">
    <img id="modalImage" src="" alt="Zoom Image">
  </div>
</div>

<!-- Carga de Panzoom desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

<style>
  /* Overlay a pantalla completa */
  .image-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.92);
    z-index: 999999;
    touch-action: none; /* Bloquea el scroll de la página en móvil */
  }

  /* Contenedor que centra la imagen perfectamente */
  .image-modal-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .image-modal-wrapper img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Botón de cierre */
  .image-modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #ffffff;
    font-size: 36px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000000;
    font-family: monospace;
    padding: 10px;
    line-height: 1;
  }
</style>

<div id="imageModal" class="image-modal-overlay">
  <span class="image-modal-close" id="modalClose">&times;</span>
  <div class="image-modal-wrapper" id="modalWrapper">
    <img id="modalImage" src="" alt="Zoom Image">
  </div>
</div>

<script>
  (function() {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.getElementById('modalClose');
    const wrapper = document.getElementById('modalWrapper');
    let panzoomInstance = null;

    document.addEventListener('DOMContentLoaded', function() {
      const postImages = document.querySelectorAll('.post img, article img, .posts img');
      postImages.forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          openModal(this.src);
        });
      });
    });

    function openModal(src) {
      modalImg.src = src;
      modal.style.display = 'block';

      // Inicializa Panzoom sobre la imagen
      panzoomInstance = Panzoom(modalImg, {
        maxScale: 6,
        minScale: 1,
        contain: 'outside',
        cursor: 'default'
      });

      // Habilita el zoom con la rueda del mouse en PC
      wrapper.addEventListener('wheel', panzoomInstance.zoomWithWheel);

      // Permite los gestos táctiles (pinch-to-zoom y arrastrar) en celular
      modalImg.parentElement.addEventListener('touchstart', panzoomInstance.bind, { passive: true });
    }

    function closeModal(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (panzoomInstance) {
        wrapper.removeEventListener('wheel', panzoomInstance.zoomWithWheel);
        panzoomInstance.destroy();
        panzoomInstance = null;
      }
      modal.style.display = 'none';
      modalImg.src = '';
    }

    closeBtn.addEventListener('click', closeModal);
    closeBtn.addEventListener('touchstart', closeModal, { passive: false });

    modal.addEventListener('click', function(e) {
      if (e.target === modal || e.target === wrapper) {
        closeModal(e);
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.style.display === 'block') {
        closeModal(e);
      }
    });
  })();
</script>
