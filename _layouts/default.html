<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/about">About</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}

    <!-- Carga de Medium Zoom desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Detecta si es pantalla móvil para ajustar márgenes
        const isMobile = window.innerWidth <= 768;

        mediumZoom('.post img, article img, .posts img', {
          margin: isMobile ? 0 : 24,          // En móvil la imagen ocupa el 100% del ancho
          background: 'rgba(0, 0, 0, 0.95)',  // Fondo oscuro para resaltar detalles
          scrollOffset: 40
        });
      });
    </script>
    
  </body>
</html>

<style>
  .image-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.92);
    z-index: 999999;
    touch-action: none;
  }

  .image-modal-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .image-modal-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
    /* Cambiado a 0 0 para controlar las transformaciones de forma precisa en móvil */
    transform-origin: 0 0;
  }

  .image-modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #fff;
    font-size: 34px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000000;
    font-family: monospace;
    padding: 10px;
  }
</style>

<div id="imageModal" class="image-modal-overlay">
  <span class="image-modal-close" id="modalClose">&times;</span>
  <div class="image-modal-container" id="modalContainer">
    <img id="modalImage" src="" alt="Zoom Image">
  </div>
</div>

<script>
  (function() {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.getElementById('modalClose');
    const container = document.getElementById('modalContainer');

    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let isMouseDragging = false;
    let initialPinchDistance = null;
    let initialScale = 1;
    let pinchCenter = { x: 0, y: 0 };

    function centerImage() {
      // Centra la imagen considerando transform-origin: 0 0
      const rect = modalImg.getBoundingClientRect();
      const imgWidth = modalImg.offsetWidth * scale;
      const imgHeight = modalImg.offsetHeight * scale;
      pointX = (window.innerWidth - imgWidth) / 2;
      pointY = (window.innerHeight - imgHeight) / 2;
    }

    function updateTransform() {
      modalImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      modalImg.style.cursor = 'zoom-in';
      // Esperar un frame a que se carguen las dimensiones reales
      requestAnimationFrame(() => {
        centerImage();
        updateTransform();
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const postImages = document.querySelectorAll('.post img, article img, .posts img');
      postImages.forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          modalImg.src = this.src;
          modal.style.display = 'block';
          resetZoom();
        });
      });
    });

    function closeModal(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      modal.style.display = 'none';
      modalImg.src = '';
    }

    closeBtn.addEventListener('click', closeModal);
    closeBtn.addEventListener('touchstart', closeModal, { passive: false });

    modal.addEventListener('click', function(e) {
      if (e.target === modal || e.target === container) {
        closeModal(e);
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.style.display === 'block') {
        closeModal(e);
      }
    });

    // ==========================================
    // LÓGICA DE PC (RUEDA + ARRASTRE INTACTOS)
    // ==========================================
    container.addEventListener('wheel', function(e) {
      e.preventDefault();
      
      let delta = -e.deltaY;
      let newScale = delta > 0 ? scale * 1.15 : scale / 1.15;
      
      if (newScale < 1) newScale = 1;
      if (newScale > 6) newScale = 6;

      // Calcular foco de zoom respecto a la posición del cursor
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      pointX = mouseX - (mouseX - pointX) * (newScale / scale);
      pointY = mouseY - (mouseY - pointY) * (newScale / scale);
      scale = newScale;

      if (scale === 1) { 
        centerImage();
        modalImg.style.cursor = 'zoom-in';
      } else {
        modalImg.style.cursor = 'grab';
      }

      updateTransform();
    }, { passive: false });

    modalImg.addEventListener('mousedown', function(e) {
      if (scale > 1 && e.button === 0) {
        e.preventDefault();
        isMouseDragging = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
        modalImg.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('mousemove', function(e) {
      if (isMouseDragging && scale > 1) {
        e.preventDefault();
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', function() {
      if (isMouseDragging) {
        isMouseDragging = false;
        if (scale > 1) {
          modalImg.style.cursor = 'grab';
        }
      }
    });

    // ==========================================
    // LÓGICA MÓVIL (ZOOM FLUIDO EN EL PUNTO TÁCTIL)
    // ==========================================
    container.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
        
        pinchCenter = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
      }
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } 
      else if (e.touches.length === 2 && initialPinchDistance) {
        e.preventDefault();
        
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );

        const currentCenter = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };

        let newScale = initialScale * (currentDistance / initialPinchDistance);
        if (newScale < 1) newScale = 1;
        if (newScale > 6) newScale = 6;

        // Ajustar el origen del punto X/Y basándose en las coordenadas relativas del pinch
        pointX = currentCenter.x - (currentCenter.x - pointX) * (newScale / scale);
        pointY = currentCenter.y - (currentCenter.y - pointY) * (newScale / scale);
        scale = newScale;

        if (scale === 1) {
          centerImage();
        }

        updateTransform();
      }
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });
  })();
</script>
