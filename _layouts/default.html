<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/about">About</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}

    <!-- Carga de Medium Zoom desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Detecta si es pantalla móvil para ajustar márgenes
        const isMobile = window.innerWidth <= 768;

        mediumZoom('.post img, article img, .posts img', {
          margin: isMobile ? 0 : 24,          // En móvil la imagen ocupa el 100% del ancho
          background: 'rgba(0, 0, 0, 0.95)',  // Fondo oscuro para resaltar detalles
          scrollOffset: 40
        });
      });
    </script>
    
  </body>
</html>

<!-- Carga de Panzoom para Zoom con Rueda de Mouse y Gestos Táctiles -->
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

<style>
  /* Fondo oscuro y modal para cuando se agrande la imagen */
  .image-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.95); /* Fondo más oscuro para enfoque */
    z-index: 99999;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* IMPORTANTE: ESTAS LÍNEAS PREVIENEN EL SCROLL NATIVO */
    touch-action: none; 
    overscroll-behavior: contain;
  }

  .image-modal-overlay img {
    /* La imagen inicia normal */
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    cursor: grab;
    /* IMPORTANTE: PARA CÁLCULOS DE PANZOOM */
    transform-origin: center center;
  }

  /* Botón de cierre más usable en celular */
  .image-modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #fff;
    font-size: 36px; /* Más grande para tocar con el dedo */
    font-weight: bold;
    cursor: pointer;
    z-index: 100000;
    font-family: monospace;
    opacity: 0.8;
    padding: 10px; /* Área de toque extendida */
  }
  .image-modal-close:hover {
    opacity: 1;
  }
</style>

<!-- Modal dinámico donde se expande la imagen -->
<div id="imageModal" class="image-modal-overlay">
  <span class="image-modal-close" id="modalClose">&times;</span>
  <img id="modalImage" src="" alt="Zoom Image">
</div>

<script>
  let panzoomInstance = null;
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImage');
  const closeBtn = document.getElementById('modalClose');

  document.addEventListener('DOMContentLoaded', function () {
    // Detecta clics en cualquier imagen de los posts
    const postImages = document.querySelectorAll('.post img, article img, .posts img');
    
    postImages.forEach(img => {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function (e) {
        // Previene comportamientos nativos y abre el modal
        e.preventDefault();
        e.stopPropagation();
        openImageModal(this.src);
      });
    });

    // Control del botón de cierre y clic fuera
    closeBtn.addEventListener('click', closeImageModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeImageModal();
      }
    });
  });

  function openImageModal(src) {
    // 1. Resetea estado de scroll de la página principal (opcional, previene saltos)
    // document.body.style.overflow = 'hidden'; 

    modalImg.src = src;
    modal.style.display = 'flex';

    // 2. Espera un microsegundo a que el DOM posicione el flex
    setTimeout(() => {
        // Inicializa el control de zoom en la imagen modal
        panzoomInstance = Panzoom(modalImg, {
          maxScale: 6,           // Zoom máximo
          minScale: 1,           // Zoom mínimo
          contain: 'outside',    // Evita arrastrar la imagen fuera del borde al 1x
          canvas: false,         // Usar escalado CSS nativo (más suave)
          cursor: 'grab'
        });

        // Zoom con la rueda del mouse en PC (Sube/Baja)
        modal.addEventListener('wheel', function(e) {
          if (!panzoomInstance) return;
          e.preventDefault();
          panzoomInstance.zoomWithWheel(e);
        }, { passive: false }); // Obligatorio para preventDefault en wheel

        // Cierra el modal con la tecla ESC
        document.addEventListener('keydown', handleEsc);
    }, 10);
  }

  function closeImageModal() {
    modal.style.display = 'none';
    
    // Reactiva scroll de la página (si se desactivó)
    // document.body.style.overflow = ''; 

    if (panzoomInstance) {
      panzoomInstance.destroy();
      panzoomInstance = null;
    }
    document.removeEventListener('keydown', handleEsc);
    modalImg.src = ''; // Limpia fuente para el próximo uso
  }

  function handleEsc(e) {
    if (e.key === 'Escape') {
      closeImageModal();
    }
  }
</script>
